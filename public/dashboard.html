<!doctype html><html><head><meta charset="utf-8"><title>Cozy Observatory Controls</title><link rel="stylesheet" href="styles.css"></head><body class="dashboard" data-admin="1"><main class="dash-grid"><section class="panel"><div class="label">Pomodoro</div><div class="timer"><div class="ring" data-ring><div class="time" data-time>25:00</div><div class="session" data-session>FOCUS · SESSION 1</div></div></div><div class="controls"><button onclick="api('timer.start')">Start / Resume</button><button class="secondary" onclick="api('timer.pause')">Pause</button><button class="secondary" onclick="api('timer.reset')">Reset</button></div><div class="form"><input id="focus" type="number" min="1" value="25" aria-label="Focus minutes"><input id="break" type="number" min="1" value="5" aria-label="Break minutes"><button onclick="api('timer.settings',{focusMinutes:focus.value,breakMinutes:break.value})">Save</button></div></section><section class="panel"><div class="label">My Tasks</div><ul data-personal></ul><form class="form" onsubmit="event.preventDefault();api('task.add',{list:'personal',text:personal.value});personal.value='' "><input id="personal" required placeholder="Add a study task"><button>Add</button></form></section><section class="panel"><div class="label">Community Queue · <span data-completed>0</span> completed</div><ul data-community></ul><form class="form" onsubmit="event.preventDefault();api('task.add',{list:'community',username:user.value,text:community.value});community.value='' "><input id="user" placeholder="Name"><input id="community" required placeholder="Submitted task"><button>Add to queue</button></form></section></main><script src="app.js"></script></body></html>
